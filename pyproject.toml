[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iled-local"
version = "1.11.14.post1"
description = "Local learning edition of iLED 1.11.14"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "iLED @ https://github.com/swanwu1996/iled-local/releases/download/v1.11.14-local-20261030/iled-1.11.14-cp310-cp310-linux_x86_64.whl#sha256=f618f1d5286bb2f290e98a64face9cce902a1d5fd4bcb63675c1822e6aecc580",
]

[project.urls]
Repository = "https://github.com/swanwu1996/iled-local"
Issues = "https://github.com/swanwu1996/iled-local/issues"

[project.scripts]
iLED = "iled_local.cli:main"
iled-local-info = "iled_local.info:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["iled_local*", "CDLE.AutoRun"]
namespaces = true
